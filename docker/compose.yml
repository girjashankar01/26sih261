# AICTE Application Validation Prototype — Compose configuration
#
# Architecture (Guide §3.2, §3.3 LocalStore — Phase A default):
# - app: FastAPI application service running on read-only filesystem with tmpfs /tmp
# - postgres: PostgreSQL 16 metadata database (Guide §3.2) storing blobs and uploads
# - vault: LocalStore content-addressed immutable filesystem vault mounted at /app/data/vault
#
# Zero extra storage containers (Guide §3.3).
# S3-compatible storage (SeaweedFS) is deferred to Phase C (see docker/compose.s3.yml).
#
# Container networking:
# - Service port is bound specifically to host localhost (127.0.0.1:8000:8000) for security.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aicte
      POSTGRES_USER: aicte_owner
      POSTGRES_PASSWORD: aicte_dev_secret
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicte_owner -d aicte"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - vault_data:/app/data/vault
    environment:
      DATABASE_URL: postgresql://aicte_owner:aicte_dev_secret@postgres:5432/aicte
      VAULT_BACKEND: local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pg_data:
  vault_data:
  # Retained so existing S3 volume is never orphaned or deleted
  storage_data:
