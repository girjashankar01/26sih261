services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://prototype:prototype@db:5432/prototype
      APP_CONFIG: /app/config.yaml
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    networks: [internal]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prototype
      POSTGRES_USER: prototype
      POSTGRES_PASSWORD: prototype
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prototype -d prototype"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
    internal: true
